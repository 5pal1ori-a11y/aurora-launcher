name: Release

# Windows에서 설치 파일을 빌드해 GitHub Release(v + package.json 의 version)로 올립니다.
# 런처의 자동 업데이트는 이 Release를 확인합니다.
# 실행: Actions 탭 → Release → Run workflow (또는 v로 시작하는 태그 push)
# 결과는 초안(Draft) Release 로 올라갑니다. Releases 에서 Publish 를 눌러야 런처가 업데이트를 받습니다.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder --win --publish never
      # 파일 3개를 한 번에 하나의 초안 Release 로 올립니다 (electron-builder 가 직접 올리면 초안이 둘로 갈라질 때가 있음)
      - name: Upload draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          else
            gh release create "$VER" dist/*.exe dist/*.blockmap dist/latest.yml --draft --title "$VER" --target "$GITHUB_SHA" --notes ""
          fi
